# Render blueprint: one small Node service that serves the game and relays
# online rooms on the same port. The free plan sleeps after 15 idle minutes
# AND has no persistent disk: set SPLIT_CHESS_DB to a managed database later,
# or self-host on a VPS (see README 部署节) for full SQLite persistence.
services:
  - type: web
    name: split-chess
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
